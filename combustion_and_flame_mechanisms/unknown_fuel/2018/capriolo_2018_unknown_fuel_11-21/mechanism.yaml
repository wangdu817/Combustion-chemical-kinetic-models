description: |-
  *********************************************************************

   A.KONNOV's detailed reaction mechanism   

   The choice of reaction rate constants is given in :  

   01KON/DER1 -
   Konnov, A.A., and De Ruyck, J. A Possible New Route for NO Formation via N2H3.  
   Combustion Science and Technology.  168: 1-46 (2001). 

   08BAT/KON343 - 
   Battin-Leclerc, F., Konnov, A.A., Jaffrezo, J.L., Legrand, M. 
   To better understand the formation of short-chain acids in combustion systems.  
   Combust. Sci. Technol., 180 (2): 343-370 (2008)

   09KON2093 -
   Konnov, A.A. Implementation of the NCN pathway of prompt-NO formation 
   in the detailed reaction mechanism.  Combustion and Flame  156: 2093-2105 (2009)

   10BUR/HAR2864 -
   Burluka, A.A., Osman, H., Harker, M., Lawes, M., Sheppard, C.G.W., Konnov, A.A. 
   Laminar burning velocities of three C3H6O isomers at atmospheric pressure.  
   Fuel, 89: 2864-2872 (2010) 

   12CHA/BRO114 -
   Chan, Y.L., Bromly, J.H., Konnov, A.A., Zhang, D.K. 
   The Comparative and Combined Effects of Nitric Oxide and Higher Alkanes 
   in Sensitising Methane Oxidation .  Combust. Sci. Technol.  184: 114-132 (2012). 

   15ALE/CHR1884 -
   Alekseev, V.A., Christensen M., Konnov A.A, The effect of temperature on the adiabatic 
   burning velocities of diluted hydrogen flames: a kinetic study using an updated mechanism.  
   Combust. Flame,  162: 1884-1898 (2015).

   15KON3753 - 
   Konnov, A.A. On the role of excited species in hydrogen combustion.  
   Combust. Flame,  162: 3753-3770 (2015). 

   16NIL/KON2443 -
   Nilsson E.J.K., Konnov A.A., Role of HOCO chemistry in syngas combustion.  
   Energy and Fuels,  30: 2443-2457 (2016) 

   16CHR/KON12 -
   Christensen M., Konnov A.A., Laminar burning velocity of acetic acid + air flames.  
   Combust. Flame,  170: 12-29 (2016)

   16FOM/ZAV198 - 
   Fomin A., Zavlev T., Alekseev V.A., Rahinov I., Cheskis S., Konnov, A.A. 
   Experimental and modelling study of 1CH2 in premixed very rich methane flames .  
   Combust. Flame,  171: 198-210 (2016) 

   16CHR/NIL6709 -
   Christensen M., Nilsson E.J.K., Konnov A.A., A systematically updated detailed kinetic 
   model for CH2O and CH3OH combustion.  Energy and Fuels  30: 6709-6726 (2016) 

   17CHR/KON97 -
   Christensen M., Konnov A.A., Laminar burning velocity of diacetyl + air flames. 
   Further assessment of combustion chemistry of ketene.  Combust. Flame , 178: 97-110 (2017)

   Other SQUIB or comments or absence of it means Work-in-progress.

  *********************************************************************

