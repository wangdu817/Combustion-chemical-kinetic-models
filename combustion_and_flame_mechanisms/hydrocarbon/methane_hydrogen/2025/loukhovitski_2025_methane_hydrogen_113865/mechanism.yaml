description: |-
  !!!!!!!!!!!!!!!!!!!!!!!!!!!!!!!!!!!!!!!!!!!!!!!!!!!!!!!!!!!!!!!!!!!!!!!!!!!!!!!
  !                                                                             !
  !                This CANTERA mechanism file is part of the                   !
  !                        Supplemental Material for                            !
  !                                                                             !
  !          A detailed kinetic submechanism for OH* chemiluminescence          !
  !                           in hydrocarbon combustion                         !
  !                                                                             !
  !                Boris I. Loukhovitski*, Alexander S. Sharipov**              !
  !                                                                             !
  !   Joint Institute for High Temperatures of the Russian Academy of Sciences  !
  !                                                                             !
  !                   * boris.loukhovitski@yandex.ru                            !
  !                  ** aleksandr.sharipov@phystech.edu                         !
  !                                                                             !
  !                       Combustion and Flame, 2025                            !
  !                                                                             !
  ! Mechanism of this file named "JIHT-OHex(CxHy)" comprises two parts:         !
  !                                                                             !
  !  -  the OH* kinetic submechanism JIHT-OHex(H2) for OH*                      !
  !     chemiluminescence in hydrogen combustion                                !
  !     developed in our previous works:                                        !
  !     [A.S. Sharipov, B.I. Loukhovitski, A.V. Pelevkin, M.R. Korshunova,      !
  !      A detailed kinetic submechanism for OH* chemiluminescence in hydrogen  !
  !      combustion revisited. Part 1 // Combustion and Flame 263 (2024) 113407 !
  !      https://doi.org/10.1016/j.combustflame.2024.113407],                   !
  !      [A.S. Sharipov, B.I. Loukhovitski, A.V. Pelevkin, M.R. Korshunova,     !
  !      A detailed kinetic submechanism for OH* chemiluminescence in hydrogen  !
  !      combustion revisited. Part 2 // Combustion and Flame 263 (2024) 113417 !
  !      https://doi.org/10.1016/j.combustflame.2024.113417]                    !
  !                                                                             !
  !  -  the kinetic submechanism developed in this work for                     !
  !     OH* chemiluminescence in hydrocarbon combustion                         !
  !                                                                             !
  !  The OH* kinetics we developed is to be used together with any              !
  !  other H2-CnHy-O2-N2 chemistry model.                                       !
  !                                                                             !
  !  It is worth noting that when applying the JIHT-OHex(CxHy) submechanism     !
  !  to a particular hydrocarbon fuel                                           !
  !  - it may turn out that some of the species involved in the JIHT-OHex(CxHy) !
  !    model are missing from the base ground-state reaction mechanism chosen   !
  !    for this fuel. In these cases, in order not to confuse the               !
  !    Chemkin/Cantera preprocessor, the processes with these species are to be !
  !    removed from the source JIHT-OHex(CxHy) files.                           !
  !  - If the basic ground-state mechanism in use includes the species named    !
  !    differently than in our OH* submechanism, the notation is to be          !
  !    adjusted accordingly.                                                    !
  !  - At last, the rate constants of the processes with collision partner M    !
  !    provided in this file are to be duplicated for all isomers of a given M  !
  !    that are present in the basic ground-state mechanism.                    !
  !                                                                             !
  !!!!!!!!!!!!!!!!!!!!!!!!!!!!!!!!!!!!!!!!!!!!!!!!!!!!!!!!!!!!!!!!!!!!!!!!!!!!!!!

