description: |-
  Methyl Formate Oxidation: Speciation Data, Laminar Burning Velocities, Ignition Delay Times and a Validated Chemical Kinetic Model
  S. Dooley, M.P. Burke, M. Chaos, Y. Stein, F.L. Dryer, V.P. Zhukov, O. Finch, J.M. Simmie and H.J. Curran.
  Comments to Stephen Dooley, Princeton University, dooleys@princeton.edu                        
  BROADLY SPEAKING SUBMECHANISM CONSISTS OF
  	1)	C0-C1 FROM LI ET AL. IJCK 36:565 (2004).
  	2)	C2-C4 FROM HEALY ET AL. !HEALY ET AL C&F, 155: 451 461 (2008).
         3)      SOME C3-C4 REACTIONS FROM LASKIN ET AL.(LASKIN ET AL. IJCK 32 589-614 2000)
                 ARE ALSO INCLUDED. REACTIONS THAT PRODUCE LARGER THAN C4 PRODUCTS HAVE BEEN
                 REMOVED.
  NOTES ON USING THE MECHANISM:
  	1)	SEARCH FOR 'MAIN BATH' TO COMMENT OUT THE APPROPRIATE EXPRESSION
  		FOR H + O2 (+M)  =  HO2 (+M)
         2)      SOME PRESSURE DEPENDENT REACTIONS MUST BE COMMENTED/UNCOMMENTED
                 DEPENDING ON PRESSURE UNDER INVESTIGATION. SEARCH FOR "PRESSURE".
         3)      REACTIONS PRODUCING AROMATIC SPECIES HAVE BEEN COMMENTED OUT. SEARCH
                 FOR "AROMATIC" TO UNCOMMENT IF THIS MECHANISM IS USED AS A BASE FOR LARGER
                 MECHANISMS.
  converted from RMG by CFG

