description: |-
  This mechanism is the supplementary material to the work of
  Authors: Mengdi Li, Denghao Zhu*, Xiaoyu He, Kai Moshammer, Ravi Fernandes, Bo Shu
  Title: Experimental and kinetic modeling study on auto-ignition properties of ammonia/ethanol blends at intermediate temperature and high pressure

  *****************************************************************************
  *****************************************************************************
  ****************** For further documentation of mechanism:  *****************
  ****************** see references below and their citations *****************
  *****************************************************************************
  *****************************************************************************

  *****************************************************************************
                           Nitrogen sub-mechanism                             *
  *****************************************************************************

  P. Glarborg, J.A. Miller, B. Ruscic, S.J. Klippenstein,         
  "Modeling Nitrogen Chemistry in Combustion",                    
  Prog. Energy Combust. Sci. 67 (2018) 31-68.  

  *****************************************************************************
                            Ethanol sub-mechanism                             *
  *****************************************************************************

  Y. Zhang, H. El-Merhubi, B. Lefort, L. Le Moyne, H.J. Curran, A. Kéromnès
  "Probing the low-temperature chemistry of ethanol via the addition of dimethyl ether"

  based on the AramcoMech 1.3  

  including the H2/CO/O2 reactions of Kéromnès et al.
  A. Kéromnès, W.K. Metcalfe, K.A. Heufer, N. Donohoe, A.K. Das, C.-J. Sung, J. Herzler, C. Naumann, P. Griebel, O. Mathieu, M.C. Krejci, E.L. Petersen, W.J. Pitz, H.J. Curran
  "An experimental and detailed chemical kinetic modeling study of hydrogen and syngas mixture oxidation at elevated pressures"
  Combust. Flame. 160 (2013) 995–1011.

  including the C1-C2 reactions of Metcalfe et al. 
  W.K. Metcalfe, S.M. Burke, S.S. Ahmed, H.J. Curran
  "A Hierarchical and Comparative Kinetic Modeling Study of C1 − C2 Hydrocarbon and Oxygenated Fuels"
  Int. J. Chem. Kinet. 45 (2013) 638–675.

  including some crucial Ethanol reactions from Mittal et al.
  G. Mittal, S.M. Burke, V.A. Davies, B. Parajuli, W.K. Metcalfe, H.J. Curran
  "Autoignition of ethanol in a rapid compression machine"
  Combust. Flame. 161 (2014) 1164–1171.

  *****************************************************************************
                     NH3/C2H5OH (ammonia/ethanol) subset                      *
  ***************************************************************************** 

  Mengdi Li, Denghao Zhu, Xiaoyu He, Kai Moshammer, Ravi Fernandes, Bo Shu
  "Experimental and kinetic modeling study on auto-ignition properties of ammonia/ethanol blends at intermediate temperature and high pressure"

