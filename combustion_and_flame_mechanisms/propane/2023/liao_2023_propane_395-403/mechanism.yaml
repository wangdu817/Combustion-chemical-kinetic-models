description: |-
  A kinetic investigation on low-temperature ignition of propane with ozone addition in an RCM 
  Wanxiong Liao, Zhaohan Chu, Yiru Wang, Bin Yang*

  SMM1 Kinetic mechanism for propane with ozone addition

  The O3 sub-mechanism is from 
  H. Zhao, X. Yang, Y. Ju, Kinetic studies of ozone assisted low temperature oxidation of dimethyl ether in a flow reactor using molecular-beam mass spectrometry, Combust. Flame 173 (2016) 187-194.

  The propane sub-mechanism is from the C0-C3 module of NUIGMech1.2.
  S. Martinez, M. Baigmohammadi, V. Patel, S. Panigrahy, A.B. Sahu, S. Nagaraja, A. Ramalingam, K.A. Heufer, A. Pekalski, H.J. Curran, A comprehensive experimental and modeling study of the ignition delay time characteristics of ternary and quaternary blends of methane, ethane, ethylene, and propane over a wide range of temperature, pressure, equivalence ratio, and dilution, Combust. Flame 234 (2021) 111626.


  \START_ELEMENTS_LIST
