  2. A. Ramalingam, S. Panigrahy, Y. Fenard, H. Curran, and K.A. Heufer. A chemical kinetic perspective on the low-temperature oxidation of propane/propene mixtures through experiments and kinetic analyses, Combustion and Flame 223 (2021) 361-375.
  3. M. Baigmohammadi, V. Patel, S. Nagaraja, A. Ramalingam, S. Martinez, S. Panigrahy, A. Mohamed, K.P. Somers, U. Burke, K.A. Heufer, A. Pekalski, H.J. Curran, Comprehensive experimental and simulation study of the ignition delay time characteristics of binary blended methane, ethane, and ethylene over a wide range of temperature, pressure, equivalence ratio, and dilution, Energy Fuels 34 (2020) 8808-8823.
  4. S.S. Nagaraja, J. Liang, S. Dong, S. Panigrahy, A.B. Sahu, G. Kukkadapu, W.J. Pitz, H.J. Curran, A hierarchical single-pulse shock tube pyrolysis study of C2-C6 1-alkenes, Combustion and Flame 219 (2020) 456-466.
