  7. A. Abd El-Sabor Mohamed, S. Panigrahy, A.B. Sahu, G. Bourque, H.J. Curran, An experimental and modeling study of the auto-ignition of natural gas blends containing C1-C7 n-alkanes, Proceedings of the Combustion Institute 38 (2021) accepted.
  8. S.S. Nagaraja, J. Power, G. Kukkadapu, S. Dong, S.W. Wagnon, W.J. Pitz, H.J. Curran, A single pulse shock tube study of pentene isomer pyrolysis, Proceedings of the Combustion Institute 38 (2021) accepted.
  9. S. Dong, K. Zhang, P.K. Senecal, G. Kukkadapu, S.W. Wagnon, S. Barrett, N. Lokachari, S. Panigrahy, W.J. Pitz, H.J. Curran, A comparative reactivity study of 1-alkene fuels from ethylene to 1-heptene, Proceedings of the Combustion Institute 38 (2021) accepted.
  10. S. Dong, K. Zhang, E.M. Ninnemann, A. Najjar, G. Kukkadapu, J. Baker, F. Arafin, Z. Wang, W.J. Pitz, S.S. Vasu, S.M. Sarathy, P.K. Senecal, H.J. Curran, A comprehensive experimental and kinetic modeling study of 1- and 2-pentene, Combustion and Flame (2021) accepted.
