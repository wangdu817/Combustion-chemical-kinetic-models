description: |-
  **************************************************************************************************************************************************************************
  Reaction Mechanism of Dimethyl ether in CHEMKIN format                                                                                                                *
  Title:   Experimental and kinetic modeling study of the low- and intermediate- temperature oxidation of dimethyl ether                                                                           *
  Authors: Zhandong Wang, Xiaoyuan Zhang, Lili Xing, Lidong Zhang, Friederike Herrmann, Kai Moshammer, Fei Qi*, Katharina Kohse-Hoinghaus*                                                   *
  Address: Department of Chemistry, Bielefeld University, Germany, Universitatsstr. 25, D-33615 Bielefeld, Germany
           National Synchrotron Radiation Laboratory, University of Science and Technology of China, Hefei, Anhui 230029, P. R. China                                      *
  Corresponding author: KKH, e-mail: kkh@uni-bielefeld.de, Phone: +49-521-106-2052; FQ, e-mail: fqi@ustc.edu.cn, Phone: +86-551-63602125                                                                                                                                                                      *
  ************************************************************************************************************************************************************************** 

  The reaction mechanism is based on the Zhao model ((c) Zhao, Chaos, Kazakov, and Dryer; Princeton University, 2007.). 

  The improvement of the model was done by updating the following reactions:

  CH3OCH3+OH=CH3OCH2+H2O
  CH3OCH3+H=CH3OCH2+H2
  CH3OCH3=CH3O+CH3
  CH3OCH2+O2
  CH3OCH2O2=CH2OCH2O2H
  CH3OCH2O2+CH3OCH2O2
  the decomposition mechanism of OCH2OCHO
  CH2O+OH=HCO+H2O
  CH2O+OH=HOCH2O
  H+O2(+M)=HO2(+M)

   note: quick find these modifications, please search "Zhandong Wang"

  **************************************************************************************************************************************************************************
  Thermodynamic data of Dimethyl ether in CHEMKIN format                                                                                                                *
  Title:   Experimental and kinetic modeling study of the low- and intermediate- temperature oxidation of dimethyl ether                                                                           *
  Authors: Zhandong Wang, Xiaoyuan Zhang, Lili Xing, Lidong Zhang, Friederike Herrmann, Kai Moshammer, Fei Qi*, Katharina Kohse-Hoinghaus*                                                    *
  Address: Department of Chemistry, Bielefeld University, Germany, Universitatsstr. 25, D-33615 Bielefeld, Germany
           National Synchrotron Radiation Laboratory, University of Science and Technology of China, Hefei, Anhui 230029, P. R. China                                      *
  Corresponding author: KKH, e-mail: kkh@uni-bielefeld.de, Phone: +49-521-106-2052; FQ, e-mail: fqi@ustc.edu.cn, Phone: +86-551-63602125                                                                                                                                                                      *
  ************************************************************************************************************************************************************************** 

   The thermodynamic data is taken from the Zhao model ((c) Zhao, Chaos, Kazakov, and Dryer; Princeton University, 2007.).
   The thermodynamic data of OCHOCHO was calculated in this work, added at the end of the file. 

