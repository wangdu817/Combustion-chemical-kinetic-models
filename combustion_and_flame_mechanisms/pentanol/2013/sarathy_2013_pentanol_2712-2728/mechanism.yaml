description: |-
  A comprehensive experimental and modeling study of iso-pentanol combustion

  Submitted to Combustion and Flame, May 2013

  S. Mani Sarathy1*, Sungwoo Park1, Bryan Weber2, Weijing Wang3, Peter Veloo4, 
  Alexander C. Davis1, Casimir Togbe5, Charles K. Westbrook6, Okjoo Park7, 
  Guillaume Dayma5, Zhaoyu Luo2, Matthew A. Oehlschlaeger3, Fokion Egolfopoulos7, 
  Tianfeng Lu2, William J. Pitz6, Chih-Jen Sung2, Philippe Dagaut5

  1 Clean Combustion Research Center, King Abdullah University of Science and Technology, Thuwal, Kingdom of Saudi Arabia
  2 Department of Mechanical Engineering, University of Connecticut, Storrs, CN, United States
  3 Mechanical, Aerospace, and Nuclear Engineering, Rensselaer Polytechnic Institute, Troy, NY, USA
  4 Department of Mechanical and Aerospace Engineering, Princeton University, Princeton, NJ, USA
  5 CNRS-INSIS, 1C, Ave de la Recherche Scientifique, Orleans Cedex 2, France
  6 Lawrence Livermore National Laboratory, Livermore, CA, USA
  7 Department of Aerospace and Mechanical Engineering, University of Southern California, Los Angeles, CA 90089, USA

  *Corresponding Author:
  S. Mani Sarathy
  mani.sarathy@kaust.edu.sa
  Clean Combustion Research Center, King Abdullah University of Science and Technology
  Thuwal 23955-6900
  Kingdom of Saudi Arabia

  version:nc5_54.8.inp
  authors:w. k. metcalfe, s. burke, h. j. curran
  21/09/2011
  added new ketene thermochemistry

  added detailed thermo for c2h2oh

  wkm 06/07/2011
  new species added:c2h3oh,o2ch2cho,ho2ch2co
  new thermo for ch3o2, very important for low T, high P CH4 ignition
  07/03/2011
  corrected editing problems causing CHEMREV to crash.
  Updated thermo from Burcat database when species was available
  retained previous values for ch3o2 and c2h5
  c3h5-a, c3h5-a, c3h5-p from laskin's butadiene paper
  22/03/2011
  previous thermo for c3h5o, c2h3cho, c2h3co. Burcat's values caused overprediction of reactivity
  for propene FR. This is a problem with the kinetics which will be examined later

