description: |-
  Title: A Comprehensive Kinetic Modeling and Experimental Study of NH3 -Methanol/Ethanol Combustion Towards Net-Zero CO2 Emissions
  Authors: Krishna P. Shrestha, Binod R. Giri, Ronan Pele, Khalid Aljohani, Pierre Brequigny, Fabian Mauss, Fabien Halter, Lam K. Huynh, Christine Rousselle
  Corresponding authors: krishna.shrestha@louisiana.edu. giri@b-tu.de
  ------------------------------------------------------------------------------------------
   [ H/N/O ] subset

      Detailed Kinetic Mechanism for the Oxidation of Ammonia Including the Formation and Reduction of Nitrogen Oxides
   Energy Fuels 2018, 32, 10202   10217; https://doi.org/10.1021/acs.energyfuels.8b01056
   Krishna Prasad Shrestha, Lars Seidel, Thomas Zeuch, and Fabian Mauss

   [ H/C/N/O ] Hydrocarbon subset with extended Nitrogen Chemistry: Hydrocarbon-NOx/NH3 interaction

      Kinetic Modeling of NOx Formation and Consumption during Methanol and Ethanol Oxidation
   Combustion Science and Technology, 191:9, 1628-1660, https://doi.org/10.1080/00102202.2019.1606804
   Krishna P. Shrestha, Lars Seidel, Thomas Zeuch, and Fabian Mauss

      Insights into nitromethane combustion from detailed kinetic modeling    Pyrolysis experiments in jet-stirred and flow reactors
   Fuel 261 (2020) 116349; https://doi.org/10.1016/j.fuel.2019.116349
   Krishna P. Shrestha, Nicolas Vin, Olivier Herbinet, Lars Seidel, Fr  d  rique Battin-Leclerc, Thomas Zeuch, Fabian Mauss

      A comprehensive kinetic model for dimethyl ether and dimethoxymethane oxidation and NOx interaction utilizing experimental
   laminar flame speed measurements at elevated pressure and temperature
   Combustion and Flame 218 (2020) 57-74, https://doi.org/10.1016/j.combustflame.2020.04.016
   Krishna Prasad Shrestha, Sven Eckart, Ayman M. Elbaz, Binod R. Giri, Chris Fritsche, Lars Seidel, William L. Roberts, Hartmut Krause, Fabian Mauss

      Detailed Chemical Kinetic Study of Acetaldehyde Oxidation and Its Interaction with NOx
   Krishna Prasad Shrestha, Binod Raj Giri, Mohammad Adil, Lars Seidel, Thomas Zeuch, Aamir Farooq, and Fabian Mauss
   Energy & Fuels 2021 35 (18), 14963-14983, https://doi.org/10.1021/acs.energyfuels.1c01948

   A detailed chemical insights into the kinetics of diethyl ether enhancing ammonia combustion and the importance of NOx recycling mechanism
   Krishna Prasad Shrestha, B.R. Giri, A.M. Elbaz, G. Issayev, W.L. Roberts, L. Seidel, F. Mauss, A. Farooq,
   Fuel Commun. 10 (2022) 100051, https://doi.org/10.1016/j.jfueco.2022.100051
  -------------------------------------------------------------------------------------------
   This mechanism is also validated for following fuels and mixtures
   H2, H2/CO, NH3, NH3/H2, H2/N2O, H2/NO2, CO/NO, CO/NO2, CO/N2O, CH4, CH3OH, CH2O
   CH4/NO, CH4/NO2, CH4/N2O, HCN, CH3OH/NO, CH3OH/NO2, C2H5OH, C2H5OH/NO, C2H2, C2H4, C2H6
   C2H2/NOx, C2H4/NOx, C2H6/NOx, NH3/NOx
   CH3NO2 : Nitromethane
   CH3OH : Methanol
   C2H5OH : Ethanol
   CH3OCH3-DME : DME
   CH3OCH2OCH3 : DMM (OME1)
   C2H5OC2H5 : DEE

