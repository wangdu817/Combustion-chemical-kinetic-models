description: |-
  Reaction mechanism (in a Chemkin-compatible format) used in:
  "Chemiluminescence during the high-temperature pyrolysis and oxidation of ammonia"
    A. Matsugi, Combust. Flame 269 (2024) 113706.

  based on:
   - NH3/H2/O2 mechanism: Zhu2024 [Zhu et al., Combust. Flame 260 (2024) 113239]
   - OH*(OHEX): Sharipov2024 [Sharipov et al., Combust. Flame 263 (2024) 113407,113417]
   - Other excited species: Konnov2023 [Konnov, Combust. Flame 253 (2023) 112788,112789]

  changes(p.w.):
   - Revised therm of NH2X, NHX, NOX, abd N2X
   - Added NOX+AR and NOX+NO quenching rate constants
   - Revised rate constant for NHX+M=NH+M and NHX+NH3=NH+NH3
   - Revised rate constant for NH2X=>NH2+hv
   - Adjusted rate constants for N2X+H=NH+N and N2X+NH=N2+NHX
   - Adjusted rate constant for NH+NO<=>N2+OHEX

  Reaction mechanism (in a Chemkin-compatible format) used in:
