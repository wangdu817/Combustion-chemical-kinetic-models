description: |-
  Combustion reaction mechanism of C0-C3/N2O flames: Experimental and kinetic modeling study of laminar burning velocity
  Yun Ge, Hong-Hao Ma, Yue Jiao, Shuo Yang, Jian-Hua Chen, Lu-Qing Wang

  Chemical kinetic mechanism for C0-C3/N2O flames.
  Developed based on Ge-Mech (Combust. Flame 278 (2025) 114253).
  C3-C4 and some of the C1-C2 species and reactions, as well as the corresponding transport and thermodynamic data, selected from San Diego-Mech (http://web.eng.ucsd.edu/mae/groups/combustion/mechanism.html).
  Active OH (OHEX) radical and reactions selected from ELTE-Mech (Int. J. Chem. Kinet. 48 (2016) 407-422).
  Rate constants of several dominant reactions were further updated. The updated rate constants originated from the literature mechanisms.

  Ge-Mech (Combust. Flame 278 (2025) 114253)
  Kinetic modeling and experimental study of laminar burning velocities of CH4/NH3/N2O/Ar premixed flames.
  GRI-Mech 3.0 was first selected as the baseline mechanism since it contains major species and reactions relevant to the combustion of CH4/NH3/N2O/Ar mixtures.
  Carbon chemistry was mainly from GRI-Mech 3.0, which includes detailed reactions of CH4 oxidation.
  NOx sub-mechanism was selected from Zhang-Mech (Combust. Flame 182 (2017) 122-141).
  NH3 oxidation was developed based on Han-Mech (Combust. Flame 213 (2020) 1-13).
  C-N interaction was selected from Konnov-Mech (Proc. Combust. Inst., 2021, 38: 805-812) and GRI-Mech 3.0.
  Methylamine subset was extracted from the work P. Glarborg et al. : Oxidation of methylamine, Int. J. Chem. Kinet. 52 (2020) 893-906.

