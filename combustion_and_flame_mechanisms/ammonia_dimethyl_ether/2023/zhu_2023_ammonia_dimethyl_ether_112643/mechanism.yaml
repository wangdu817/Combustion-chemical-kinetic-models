description: |-
  The reaction kinetics model (147 species, 1127 reactions) is developed based on Tang model, Wang model and Dai model for DME/NH3 mixtures.
  Tang model
  An experimental and modeling study of ammonia oxidation in a jet stirred reactor
  R. Tang, Q. Xu, J. Pan, J. Gao, Z. Wang, H. Wei, G. Shu
  Combust. Flame 240 (2022) 112007
  Wang model
  Experimental and kinetic modeling study of the low- and intermediate-temperature oxidation of dimethyl ether
  Z. Wang, X. Zhang, L. Xing, L. Zhang, F. Herrmann, K. Moshammer, F. Qi, K. Kohse-Hoinghaus
  Combust. Flame 162 (2015) 1113-1125
  Dai model
  Ignition delay times of NH3 /DME blends at high pressure and low DME fraction: RCM experiments and simulations 
  L. Dai, H. Hashemi, P. Glarborg, S. Gersen, P. Marshall, A. Mokhov, H. Levinsky
  Combust. Flame 227 (2021) 120-134

  The improvement of the combined model was done by updating the following reactions:
  CH3OCH2O2=CH2OCH2O2H
  NH2+HO2=H2NO+OH
  CH2O+NH2=HCO+NH3
  CO+N2O=N2+CO2

  The reaction kinetics model (147 species, 1127 reactions) is developed based on Tang model, Wang model and Dai model for DME/NH3 mixtures.
